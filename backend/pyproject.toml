[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelai-backend"
version = "1.0.0"
description = "SentinelAI - Production-Oriented Evidence-Driven Multi-Agent Application Security Intelligence Platform"
authors = [{ name = "SentinelAI Security Team" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.0",
    "bcrypt>=4.2.0",
    "pyjwt>=2.9.0",
    "httpx>=0.27.0",
    "reportlab>=4.2.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
