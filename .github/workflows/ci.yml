name: SentinelAI DevSecOps Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security-and-tests:
    name: Backend Security, Migrations & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Linting and Syntax Validation
        run: |
          pip install ruff
          ruff check backend/ --config ruff.toml

      - name: Validate Database Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Run Pytest Test Suite (41 Tests)
        run: |
          PYTHONPATH=backend pytest -v backend/tests

      - name: Run E2E Verification Flow
        run: |
          PYTHONPATH=backend python backend/tests/verify_e2e.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Type Check & Build Next.js
        working-directory: frontend
        run: npm run build
